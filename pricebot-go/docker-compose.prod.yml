# Production overlay: Caddy ile otomatik TLS, dis dunyaya sadece 80/443 acik, gunluk DB yedegi.
# Kullanim: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Alan adlari (Caddy, hepsi ayni uygulamaya): admin.smartrate.app (admin), demo.smartrate.app (portal), api.smartrate.app (musteri API).
# Farkli alan adi icin: DOMAIN="a.example.com, b.example.com" ...
services:
  postgres:
    ports: !reset []
    restart: always

  redis:
    restart: always

  app:
    ports: !reset []
    restart: always
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      SWAGGER_ENABLED: "true"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.smartrate.app}
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-https://demo.smartrate.app/portal/}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: pricebot_go_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-admin.smartrate.app, demo.smartrate.app, api.smartrate.app}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 128M

  backup:
    image: postgres:16-alpine
    container_name: pricebot_go_backup
    restart: always
    environment:
      PGPASSWORD: botpass123
      KEEP_DAYS: "14"
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  caddy_data:
  caddy_config:
  backups:
